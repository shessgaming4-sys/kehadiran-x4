<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kehadiran X-4</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #10131a;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 420px;
    background: #191d27;
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
}

h1 {
    text-align: center;
    margin-bottom: 5px;
}

.subtitle {
    text-align: center;
    color: #9ca3af;
    margin-bottom: 25px;
}

label {
    display: block;
    margin-bottom: 8px;
}

input {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: #272c38;
    color: white;
    font-size: 16px;
    outline: none;
}

.status {
    margin-top: 20px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.hadir {
    background: #22c55e;
    color: white;
}

.izin {
    background: #eab308;
    color: white;
}

.sakit {
    background: #3b82f6;
    color: white;
}

#hasil {
    text-align: center;
    margin-top: 20px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

    <h1>KEHADIRAN X-4</h1>

    <div class="subtitle">
        Absensi Harian Kelas X-4
    </div>

    <label for="nama">Nama Siswa</label>

    <input
        type="text"
        id="nama"
        placeholder="Masukkan nama kamu..."
    >

    <div class="status">

        <button class="hadir" onclick="absen('Hadir')">
            ✅ HADIR
        </button>

        <button class="izin" onclick="absen('Izin')">
            🟡 IZIN
        </button>

        <button class="sakit" onclick="absen('Sakit')">
            🔵 SAKIT
        </button>

    </div>

    <div id="hasil"></div>

</div>

<script>

function absen(status) {

    let nama = document.getElementById("nama").value;

    if (nama.trim() === "") {
        alert("Masukkan nama terlebih dahulu!");
        return;
    }

    document.getElementById("hasil").innerHTML =
        "✅ " + nama + " tercatat sebagai <b>" + status + "</b>";

}

</script>

</body>
  </html>
